<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="aegis-favicon-g" x1="8" y1="4" x2="24" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14c9b8"/>
      <stop offset="1" stop-color="#0a7d73"/>
    </linearGradient>
    <linearGradient id="aegis-favicon-fill" x1="16" y1="3" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153a40"/>
      <stop offset="1" stop-color="#091319"/>
    </linearGradient>
  </defs>
  <!-- A quiet black tile gives the mark a deliberate silhouette in browser chrome. -->
  <rect width="32" height="32" rx="8" fill="#06070a"/>
  <rect x="1" y="1" width="30" height="30" rx="7" stroke="#1e2434" stroke-opacity=".72"/>

  <!-- Aegis shield, enlarged and weighted for legibility at 16px. -->
  <path
    d="M16 2.8 26.3 6.7v8c0 6.4-4.2 11.9-10.3 14.3C9.9 26.6 5.7 21.1 5.7 14.7v-8L16 2.8Z"
    fill="url(#aegis-favicon-fill)"
    stroke="url(#aegis-favicon-g)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- The closed chevron doubles as a precise lock and a compact voice pulse. -->
  <path
    d="m10.8 15.1 5.2 5 5.2-6.7"
    stroke="#8df4e8"
    stroke-width="2.35"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
